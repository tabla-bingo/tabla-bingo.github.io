<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#6fc3ff"/>
      <stop offset="0.55" stop-color="#2b8cf5"/>
      <stop offset="1" stop-color="#1450c4"/>
    </radialGradient>
  </defs>

  <!-- Ring, back half -->
  <g transform="translate(256 262) rotate(-20)" fill="none" stroke-linecap="butt">
    <path d="M-232 0A232 62 0 0 1 232 0" stroke="#0a2a6b" stroke-width="42"/>
    <path d="M-232 0A232 62 0 0 1 232 0" stroke="#ffd92e" stroke-width="26"/>
  </g>

  <!-- Planet = bingo ball -->
  <circle cx="256" cy="262" r="148" fill="url(#planet)" stroke="#0a2a6b" stroke-width="12"/>
  <ellipse cx="205" cy="190" rx="44" ry="22" fill="#fff" opacity="0.35" transform="rotate(-35 205 190)"/>

  <!-- Number disc -->
  <circle cx="256" cy="262" r="72" fill="#fff" stroke="#0a2a6b" stroke-width="9"/>
  <text x="256" y="290" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="88" text-anchor="middle" fill="#e8192c" stroke="#0a2a6b" stroke-width="3">7</text>

  <!-- Ring, front half -->
  <g transform="translate(256 262) rotate(-20)" fill="none" stroke-linecap="butt">
    <path d="M-232 0A232 62 0 0 0 232 0" stroke="#0a2a6b" stroke-width="42"/>
    <path d="M-232 0A232 62 0 0 0 232 0" stroke="#ffd92e" stroke-width="26"/>
  </g>

  <!-- Die -->
  <g transform="translate(404 98) rotate(14)">
    <rect x="-44" y="-44" width="88" height="88" rx="16" fill="#fff" stroke="#0a2a6b" stroke-width="8"/>
    <g fill="#ff2e88" stroke="#0a2a6b" stroke-width="3">
      <circle cx="-20" cy="-20" r="9"/>
      <circle cx="0" cy="0" r="9"/>
      <circle cx="20" cy="20" r="9"/>
    </g>
  </g>
</svg>
